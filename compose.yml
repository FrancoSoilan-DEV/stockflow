services:
  api:
    build: ./backend
    container_name: stockflow-fastapi
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env

  frontend:
    build: ./frontend
    container_name: stockflow-vue
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api
    environment:
      - VITE_API_URL=http://localhost:8000

  db:
    image: postgres:16
    container_name: stockflow-db
    environment:
      POSTGRES_USER: stockflow_user
      POSTGRES_PASSWORD: stockflow_password
      POSTGRES_DB: stockflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockflow_user -d stockflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: